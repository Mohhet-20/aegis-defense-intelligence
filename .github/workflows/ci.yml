name: CI

# Status: AUTHORED, NOT EXECUTED on GitHub as of 2026-10-18 -- every command was run
# locally where the tool exists (see docs/operations/RELEASE_VERIFICATION.md).
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # least privilege; no job publishes anything or needs secrets

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend on Python ${{ matrix.python }} (SQLite suite, lint, migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Supported versions (README). 3.11 is excluded: numpy==2.5.4 requires 3.12.
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (syntax errors and undefined names only)
        # The repository has pre-existing unused-import findings; this gate
        # blocks real errors without a mass cleanup. Tighten later.
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 app tests scripts
          ruff check --select F401,F811,F841 --exclude __init__.py app scripts   # no unused imports/variables in shipped code
      - name: Configuration reference is current
        run: python scripts/gen_config_reference.py --check
      - name: Migrations apply cleanly to an empty database
        run: |
          DATABASE_URL=sqlite:///./ci_migrate.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_migrate.db alembic heads
          DATABASE_URL=sqlite:///./ci_migrate.db alembic check          # ORM and migrations agree
      - name: Tests (workflows, sweeps, contract, backup/restore, bootstrap, config)
        run: python -m pytest -q --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.13'
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  postgres:
    name: Backend on PostgreSQL 16 (migrations, full test suite, production smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-only-password   # throwaway service container, not a real credential
          POSTGRES_DB: aegis_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_BASE: postgresql+psycopg2://aegis:ci-only-password@127.0.0.1:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations on an empty PostgreSQL database, then downgrade/upgrade one step
        env:
          DATABASE_URL: ${{ env.PG_BASE }}/aegis_ci
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic current
          python scripts/check_schema_drift.py
      - name: Full test suite against PostgreSQL, in a non-UTC session time zone
        # Serial on purpose: every test drops and recreates the tables of this one database.
        # PGTZ makes libpq set a non-UTC session TimeZone -- a UTC-only setup hid the
        # analytics bucket-label defect (KNOWN_RISKS 54).
        env:
          TEST_DATABASE_URL: ${{ env.PG_BASE }}/aegis_ci
          PGTZ: Asia/Kolkata
        run: python -m pytest -q
      - name: Production-mode smoke test (fresh database, explicit migration, bootstrap admin)
        run: |
          psql() { PGPASSWORD=ci-only-password command psql -h 127.0.0.1 -U aegis -d postgres "$@"; }
          psql -c "create database aegis_smoke"
          export DATABASE_URL="$PG_BASE/aegis_smoke" ENVIRONMENT=production CV_MEDIA_STORAGE_ROOT="$RUNNER_TEMP/media" LOG_FORMAT=json
          export SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
          mkdir -p "$CV_MEDIA_STORAGE_ROOT"
          alembic upgrade head
          export AEGIS_BOOTSTRAP_PASSWORD="$(python -c 'import secrets;print("A1-"+secrets.token_urlsafe(24))')"
          python scripts/bootstrap_admin.py --organization "CI Org" --username admin --email admin@ci.example.org
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/health/ready && break; sleep 1; done
          AEGIS_SMOKE_PASSWORD="$AEGIS_BOOTSTRAP_PASSWORD" python scripts/smoke_test.py --username admin --expect-docs-disabled

  frontend:
    name: Frontend (lint, type-check, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Component and unit tests (Vitest)
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: No hard-coded backend URLs or source maps in the production bundle
        # Port-qualified only: React Router 7 ships a port-less internal "http://localhost" URL base.
        run: |
          ! grep -rlE "https?://(localhost|127\.0\.0\.1):[0-9]+" dist/assets
          ! ls dist/assets | grep -E "\.map$"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  security:
    name: Dependency and static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python dependency audit and static analysis
        working-directory: backend
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt
          bandit -q -r app -ll
      - name: Secret scan (new findings vs. the reviewed .secrets.baseline fail the job)
        run: |
          pip install detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Frontend runtime dependency audit (high and above fails; moderate findings are tracked in KNOWN_RISKS.md)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  containers:
    name: Container images and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (not pushed)
        run: docker compose build
        env:
          AEGIS_DB_PASSWORD: ci-only
          AEGIS_SECRET_KEY: ci-only-placeholder-not-used-for-build
      - name: Compose smoke test
        env:
          AEGIS_HTTP_PORT: "8080"
        run: |
          export AEGIS_DB_PASSWORD="$(python3 -c 'import secrets;print(secrets.token_hex(16))')"
          export AEGIS_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')"
          export AEGIS_BOOTSTRAP_PASSWORD="$(python3 -c 'import secrets;print("A1-"+secrets.token_urlsafe(24))')"
          docker compose up -d db
          docker compose run --rm migrate
          docker compose run --rm -e AEGIS_BOOTSTRAP_PASSWORD backend python scripts/bootstrap_admin.py --organization "CI Org" --username admin --email admin@ci.example.org
          docker compose up -d
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/v1/health/ready && break; sleep 2; done
          pip install httpx
          AEGIS_SMOKE_PASSWORD="$AEGIS_BOOTSTRAP_PASSWORD" python3 backend/scripts/smoke_test.py --base-url http://127.0.0.1:8080 --username admin --expect-docs-disabled
          echo "AEGIS_BOOTSTRAP_PASSWORD=$AEGIS_BOOTSTRAP_PASSWORD" >> "$RUNNER_TEMP/ci.env"
          echo "AEGIS_DB_PASSWORD=$AEGIS_DB_PASSWORD" >> "$RUNNER_TEMP/ci.env"
          echo "AEGIS_SECRET_KEY=$AEGIS_SECRET_KEY" >> "$RUNNER_TEMP/ci.env"
      - name: Security headers served by the frontend container
        run: |
          curl -sI http://127.0.0.1:8080/ | tee "$RUNNER_TEMP/headers.txt"
          grep -i "^content-security-policy: default-src 'self'; script-src 'self';" "$RUNNER_TEMP/headers.txt"
          grep -i "^x-frame-options: DENY" "$RUNNER_TEMP/headers.txt"
      - name: Data persists across a full stack restart
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          count() { python3 - <<'PY'
          import os, httpx
          c = httpx.Client(base_url="http://127.0.0.1:8080/api/v1", timeout=30)
          t = c.post("/auth/login", json={"username_or_email": "admin", "password": os.environ["AEGIS_BOOTSTRAP_PASSWORD"]}).json()["access_token"]
          h = {"Authorization": f"Bearer {t}"}
          print(c.get("/events", headers=h).json()["total"], c.get("/media", headers=h).json()["total"])
          PY
          }
          before="$(count)"
          docker compose down            # no -v: named volumes must survive
          docker compose up -d
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/v1/health/ready && break; sleep 2; done
          after="$(count)"
          echo "events/media before: $before  after: $after"
          test -n "$before" && test "$before" = "$after"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  demo-image:
    name: One-container public demo image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the demo image (root Dockerfile, not pushed)
        run: docker build -t aegis-demo .
      - name: Start it and wait for the demo data
        run: |
          docker run -d --name aegis-demo -p 7860:7860 aegis-demo
          for i in $(seq 1 120); do docker logs aegis-demo 2>&1 | grep -q '\[demo\] ready on port' && break; sleep 3; done
          docker logs aegis-demo 2>&1 | grep '^\[demo\]'
          docker logs aegis-demo 2>&1 | grep -q '\[demo\] ready on port'
      - name: Check the running demo
        run: |
          curl -sI http://127.0.0.1:7860/investigations | tee "$RUNNER_TEMP/h.txt"
          grep -i "^content-security-policy: default-src 'self'; script-src 'self';" "$RUNNER_TEMP/h.txt"
          pip install httpx
          python3 - <<'PY'
          import httpx
          c = httpx.Client(base_url="http://127.0.0.1:7860/api/v1", timeout=60)
          demo = c.get("/demo").json()
          assert demo["enabled"] and len(demo["accounts"]) == 4, demo
          token = c.post("/auth/login", json={"username_or_email": "admin", "password": demo["password"]}).json()["access_token"]
          h = {"Authorization": f"Bearer {token}"}
          runs = c.get("/evaluation/runs", headers=h).json()["items"]
          real = [r for r in runs if not r["is_synthetic"]]
          assert real and real[0]["metrics_detail"]["map50"] > 0.4, runs
          viewer = next(u for u in c.get("/users", headers=h).json() if u["username"] == "viewer")
          assert c.patch(f"/users/{viewer['id']}", json={"role": "administrator"}, headers=h).status_code == 403
          print("demo OK: real-photo mAP@0.5", real[0]["metrics_detail"]["map50"])
          PY
      - name: Logs on failure
        if: failure()
        run: docker logs aegis-demo 2>&1 | tail -200
      - name: Tear down
        if: always()
        run: docker rm -f aegis-demo || true
