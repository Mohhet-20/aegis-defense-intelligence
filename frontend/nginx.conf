server_tokens off;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the backend's MAX_UPLOAD_REQUEST_BYTES (default 80 MiB); nginx's
    # own default of 1m would reject every media upload with a 413.
    client_max_body_size 80m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP: scripts and styles only from this origin (no inline script), API calls
    # same-origin through /api/, images also from data:/blob: (favicon, media
    # previews) and the optional map tile host. __AEGIS_MAP_TILE_ORIGIN__ is filled
    # in at image build time by deploy/render-nginx.mjs from VITE_MAP_TILE_URL.
    # Browser-verified with `npm run preview`, which serves this exact header.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __AEGIS_MAP_TILE_ORIGIN__; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable; index.html must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback -- client-side routing (react-router) needs every
    # unknown path to resolve to index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __AEGIS_MAP_TILE_ORIGIN__; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy: the browser only ever talks to this host, so the
    # frontend's relative '/api/v1' base needs no CORS and no build-time URL.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
