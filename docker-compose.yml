# Single-host deployment of AEGIS: PostgreSQL + backend + static frontend.
#
#   cp .env.example .env        # then fill in the three REQUIRED values
#   docker compose build
#   docker compose up -d db
#   docker compose run --rm migrate          # explicit, one-shot schema migration
#   docker compose run --rm -e AEGIS_BOOTSTRAP_PASSWORD backend \
#       python scripts/bootstrap_admin.py --organization "..." --username admin --email ...
#   docker compose run --rm backend python scripts/fetch_models.py   # optional: real detector weights
#   docker compose up -d
#   docker compose ps                        # backend/db show "healthy"
#
# Secrets come from .env (git-ignored); this file contains none. Default
# ENVIRONMENT is production, so the backend refuses to start with a weak SECRET_KEY.
# Persistent data: named volumes aegis_pg_data (database) and aegis_media
# (uploads + report artifacts). Back both up together (docs/operations/BACKUP_AND_RESTORE.md).
# Verification status: see docs/operations/RELEASE_VERIFICATION.md -- these images
# could not be built in the authoring environment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD:?set AEGIS_DB_PASSWORD in .env}
      POSTGRES_DB: aegis
    # No published port: only the backend, on the compose network, reaches the database.
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: &backend_env
      ENVIRONMENT: ${AEGIS_ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg2://aegis:${AEGIS_DB_PASSWORD:?set AEGIS_DB_PASSWORD in .env}@db:5432/aegis
      SECRET_KEY: ${AEGIS_SECRET_KEY:?set AEGIS_SECRET_KEY in .env (python -c "import secrets;print(secrets.token_urlsafe(48))")}
      CORS_ALLOWED_ORIGINS: ${AEGIS_CORS_ORIGINS:-http://localhost:8080}
      TRUST_FORWARDED_HEADERS: ${AEGIS_TRUST_FORWARDED_HEADERS:-false}
      LOG_FORMAT: ${AEGIS_LOG_FORMAT:-json}

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *backend_env
    volumes:
      - aegis_media:/data/media
      - aegis_models:/data/models    # pretrained weights: docker compose run --rm backend python scripts/fetch_models.py
    # Reached through the frontend's nginx proxy; not published to the host by default.
    expose:
      - "8000"
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_MAP_TILE_URL: ${AEGIS_MAP_TILE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${AEGIS_HTTP_PORT:-8080}:8080"

volumes:
  aegis_pg_data:
  aegis_media:
  aegis_models:
